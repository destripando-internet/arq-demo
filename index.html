  <header class="app-header">
    <div class="container">
      <a class="app-name" href="#demos" data-text="title">ARQ protocols</a>
      <nav class="app-nav" data-text-aria="nav">
        <a href="#demos" data-view="demos" data-text="view.demos">Demos</a>
        <a href="#sim" data-view="sim" data-text="view.sim">Simulation</a>
      </nav>
      <div class="app-tools">
        <div class="app-tools-group">
          <a class="btn btn-text" href="#help" data-view="help" data-text="help">Help</a>
        </div>
        <label class="visually-hidden" for="lang" data-text="language">Language</label>
        <select id="lang" class="select">
          <option value="en" lang="en">English</option>
          <option value="es" lang="es">Español</option>
        </select>
        <label class="visually-hidden" for="theme-select" data-text="theme">Theme</label>
        <select id="theme-select" class="select">
          <option value="system" data-text="theme.system">Theme: system</option>
          <option value="light" data-text="theme.light">Theme: light</option>
          <option value="dark" data-text="theme.dark">Theme: dark</option>
        </select>
      </div>
    </div>
  </header>

  <main id="main" class="container" tabindex="-1">
    <noscript><div class="alert alert-error"><div class="alert-body">
      <p>This application needs JavaScript. / Esta aplicación necesita JavaScript.</p></div></div></noscript>

    <section id="view-demos" class="demos" aria-labelledby="h-demos" hidden>
      <h1 id="h-demos" data-text="view.demos">Demos</h1>
      <div id="demo-list"></div>
    </section>

    <section id="view-sim" class="sim" aria-labelledby="h-sim" hidden>
      <h1 id="h-sim" class="visually-hidden" data-text="view.sim">Simulation</h1>
      <div class="sim-side" id="sim-side">
        <section id="demo" class="alert demo" hidden></section>

        <form id="controls" novalidate>
          <fieldset class="group">
            <legend data-text="algorithm">Algorithm</legend>
            <div class="line">
              <label class="inline-field"><span data-text="protocol">Protocol</span>
                <select name="p" class="select select-sm"></select></label>
              <label class="inline-field"><span data-text="ack">ACKs</span>
                <select name="ack" class="select select-sm"></select></label>
            </div>
            <div class="line">
              <label class="inline-field">k
                <input name="k" type="number" inputmode="numeric" min="1" max="5" class="input input-sm num narrow"></label>
              <label class="inline-field"><span>W<sub>s</sub></span>
                <input name="w" type="number" inputmode="numeric" min="1" max="31" class="input input-sm num narrow"></label>
              <label class="inline-field"><span data-text="timeout">Timeout</span>
                <input name="to" type="number" inputmode="decimal" min="0.1" max="2000" step="any" class="input input-sm num" data-text-tooltip="timeout.hint"></label>
            </div>
          </fieldset>

          <fieldset class="group">
            <legend data-text="scenario">Scenario</legend>
            <div class="line">
              <label class="inline-field"><span data-text="link">Link</span>
                <select name="link" class="select select-sm" data-text-tooltip="link.hint"></select></label>
            </div>
            <div class="line">
              <label class="inline-field"><span>t<sub>trans</sub></span>
                <input name="tt" type="number" inputmode="decimal" min="0.1" max="20" step="any" class="input input-sm num" data-text-tooltip="tt.hint"></label>
              <label class="inline-field"><span>t<sub>prop</sub></span>
                <input name="d" type="number" inputmode="decimal" min="0" max="1000" step="any" class="input input-sm num" data-text-tooltip="d.hint"></label>
              <label class="inline-field">a
                <output id="calc-a" class="input input-sm num calc"></output></label>
              <label class="inline-field">1 + 2a
                <output id="calc-2a" class="input input-sm num calc"></output></label>
            </div>
            <div class="line">
              <label class="inline-field"><span data-text="messages">Messages</span>
                <input name="n" type="number" inputmode="numeric" min="1" max="60" class="input input-sm num narrow"></label>
              <label class="inline-field"><span data-text="loss">Losses (%)</span>
                <input name="r" type="number" inputmode="numeric" min="0" max="50" value="0" class="input input-sm num narrow"></label>
            </div>
          </fieldset>
        </form>

        <section id="state" aria-live="off"></section>
      </div>

      <div class="sim-split" id="sim-split" role="separator" aria-orientation="vertical" tabindex="0"
           aria-controls="sim-side" aria-valuemin="0" aria-valuemax="100"></div>

      <div class="sim-main">
        <div class="sim-head">
          <div class="player" id="player" role="group" data-text-aria="player">
            <div class="player-controls">
              <div class="player-buttons">
                <button type="button" class="btn btn-icon" data-act="reset" aria-keyshortcuts="Home"><svg aria-hidden="true"><use href="#i-skip-previous"/></svg></button>
                <button type="button" class="btn btn-icon" data-act="prev" aria-keyshortcuts="ArrowLeft"><svg aria-hidden="true"><use href="#i-navigate-before"/></svg></button>
                <button type="button" class="btn btn-icon btn-primary" data-act="play" aria-keyshortcuts="Space"><svg aria-hidden="true"><use href="#i-play-arrow"/></svg></button>
                <button type="button" class="btn btn-icon" data-act="step" aria-keyshortcuts="ArrowRight"><svg aria-hidden="true"><use href="#i-navigate-next"/></svg></button>
                <button type="button" class="btn btn-icon" data-act="end" aria-keyshortcuts="End"><svg aria-hidden="true"><use href="#i-skip-next"/></svg></button>
              </div>
              <span class="seq-counter" id="counter"></span>
              <span class="player-speed">
                <label for="speed" data-text="speed">Speed</label>
                <select id="speed" name="speed" class="select select-sm">
                  <option value="0.5">0.5×</option>
                  <option value="1" selected>1×</option>
                  <option value="2">2×</option>
                  <option value="4">4×</option>
                </select>
              </span>
            </div>
            <div class="player-track">
              <div class="player-marks" id="marks" aria-hidden="true"></div>
              <input type="range" class="player-timeline" id="timeline-range" min="0" max="1000" step="any"
                     data-text-aria="timeline.range" aria-keyshortcuts="ArrowLeft ArrowRight Home End">
            </div>
            <p class="visually-hidden" role="status" id="player-status"></p>
          </div>

          <section id="tape" class="tape"></section>
        </div>

        <div id="timeline-wrap">
          <svg id="timeline" xmlns="http://www.w3.org/2000/svg" role="group" tabindex="-1" aria-keyshortcuts="ArrowUp ArrowDown Enter"></svg>
        </div>
        <details class="events" id="events">
          <summary data-text="events.title">The diagram as a table</summary>
          <div id="events-table"></div>
        </details>
      </div>
    </section>

    <section id="view-help" class="guide" aria-labelledby="h-help" hidden>
      <h1 id="h-help" data-text="help">Help</h1>
      <div id="guide"></div>
    </section>
  </main>

  <footer class="status-bar">
    <div class="container">
      <span id="version"></span>
      <p class="status-bar-message" role="status" id="status-message"></p>
    </div>
  </footer>

  <script src="style-guide/components.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
