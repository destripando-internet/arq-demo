<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARQ protocols</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1><span data-i18n="title">ARQ protocols</span> <small id="version" class="version"></small></h1>
    <div class="btn-group btn-group-sm" role="group" id="lang" data-i18n-aria="language">
      <button type="button" class="btn btn-outline-secondary" data-lang="es">ES</button>
      <button type="button" class="btn btn-outline-secondary" data-lang="en">EN</button>
    </div>
  </header>

  <ul class="nav nav-tabs" id="tabs" role="tablist">
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link active" role="tab" data-tab="demos" data-i18n="tab.demos"></button></li>
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" role="tab" data-tab="sim" data-i18n="tab.sim"></button></li>
    <li class="nav-item" role="presentation">
      <button type="button" class="nav-link" role="tab" data-tab="guide" data-i18n="tab.guide"></button></li>
  </ul>

  <div id="tab-demos" class="demos" role="tabpanel"></div>

  <div id="tab-sim" role="tabpanel" hidden>
  <section id="demo" class="demo" hidden></section>
  <form id="controls" onsubmit="return false">
    <div class="groups">
      <fieldset class="group">
        <legend data-i18n="algorithm"></legend>
        <div class="line">
          <label><span data-i18n="protocol"></span>
            <select name="p" class="form-select form-select-sm"></select></label>
          <label data-i18n-title="ack.title"><span data-i18n="ack"></span>
            <select name="ack" class="form-select form-select-sm"></select></label>
        </div>
        <div class="line">
          <label data-i18n-title="k.title">k
            <input name="k" type="number" min="1" max="5" class="form-control form-control-sm narrow"></label>
          <label data-i18n-title="w.title"><span>W<sub>s</sub></span>
            <input name="w" type="number" min="1" max="31" class="form-control form-control-sm narrow"></label>
          <label data-i18n-title="timeout.title"><span data-i18n="timeout"></span>
            <input name="to" type="number" min="0.1" max="2000" step="any" class="form-control form-control-sm"></label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend data-i18n="scenario"></legend>
        <div class="line">
          <label data-i18n-title="link.title"><span data-i18n="link"></span>
            <select name="link" class="form-select form-select-sm"></select></label>
        </div>
        <div class="line">
          <label data-i18n-title="tt.title"><span>t<sub>trans</sub></span>
            <input name="tt" type="number" min="0.1" max="20" step="any" class="form-control form-control-sm"></label>
          <label data-i18n-title="d.title"><span>t<sub>prop</sub></span>
            <input name="d" type="number" min="0" max="1000" step="any" class="form-control form-control-sm"></label>
          <label data-i18n-title="calc.title">a <output id="calc-a" class="calc"></output></label>
          <label data-i18n-title="calc.title">1 + 2a <output id="calc-2a" class="calc"></output></label>
        </div>
        <div class="line">
          <label><span data-i18n="messages"></span>
            <input name="n" type="number" min="1" max="60" class="form-control form-control-sm"></label>
          <label><span data-i18n="loss"></span>
            <input name="r" type="range" min="0" max="50" step="5" value="0" class="form-range">
            <output for="r" data-unit="%"></output></label>
        </div>
      </fieldset>
    </div>

    <div class="player">
      <div class="btn-group" role="group">
        <button type="button" class="btn btn-outline-secondary" data-act="reset" data-i18n-title="reset"><i class="bi bi-skip-backward-fill"></i></button>
        <button type="button" class="btn btn-outline-secondary" data-act="prev" data-i18n-title="prev"><i class="bi bi-skip-start-fill"></i></button>
        <button type="button" class="btn btn-primary" data-act="play" data-i18n-title="play"><i class="bi bi-play-fill"></i></button>
        <button type="button" class="btn btn-outline-secondary" data-act="step" data-i18n-title="step"><i class="bi bi-skip-end-fill"></i></button>
        <button type="button" class="btn btn-outline-secondary" data-act="end" data-i18n-title="end"><i class="bi bi-skip-forward-fill"></i></button>
      </div>
      <label><span data-i18n="speed"></span>
        <select name="speed" class="form-select form-select-sm">
          <option value="0.5">0.5×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select></label>
      <span id="clock" class="clock-readout"></span>
    </div>
  </form>

  <section id="state"></section>

  <p class="hint diagram-hint" id="diagram-hint"></p>

  <section id="tape" class="tape"></section>

  <div id="timeline-wrap">
    <svg id="timeline" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
  </div>

  <div id="tab-guide" class="guide" role="tabpanel" hidden></div>

  <script type="module" src="main.js"></script>
</body>
</html>
